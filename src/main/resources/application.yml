server:
  port: 8080
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:your-api-key-here}
      # DashScope OpenAI 兼容端点：https://dashscope.aliyuncs.com/compatible-mode/v1
      # DeepSeek：https://api.deepseek.com
      # 本地 Ollama：http://localhost:11434
      base-url: ${OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      chat:
        options:
          model: ${OPENAI_MODEL:qwen-max}
          temperature: 0.1

skill:
  directory: ./skills           # Skill 目录（页面上展示供用户选择）
  agent-directory: ./agents     # Agent 目录（被 Skill 通过 spawn_agent 调用）
  work-directory: .             # Shell 工具的工作目录
  shell:
    forbidden-commands:         # Shell 命令黑名单（逗号分隔，忽略大小写，匹配命令中任意位置）
      - "rm -rf /"
      - "shutdown"
      - "reboot"
      - "format"
      - "mkfs"
      - "dd if="
      - ":(){ :|:&}"
